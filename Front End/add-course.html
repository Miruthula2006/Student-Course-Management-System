<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Add a new course to the Student Course Management System Administrator Panel.">

    <title>Add Course</title>

    <!-- CSS -->

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/dashboard.css">

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- =========================
             SIDEBAR
    ========================== -->

    <aside class="sidebar">

        <h2>

            <i class="fa-solid fa-user-shield"></i>

            SCMS

        </h2>

        <p>

            Administrator Panel

        </p>

        <ul>

            <li>

                <a href="admin-dashboard.html">

                    <i class="fa-solid fa-house"></i>

                    Dashboard

                </a>

            </li>

            <li>

                <a href="manage-courses.html">

                    <i class="fa-solid fa-book"></i>

                    Manage Courses

                </a>

            </li>

            <li class="active">

                <a href="add-course.html">

                    <i class="fa-solid fa-circle-plus"></i>

                    Add Course

                </a>

            </li>

            <li>

                <a href="manage-students.html">

                    <i class="fa-solid fa-users"></i>

                    Manage Students

                </a>

            </li>

            <li>

                <a href="view-enrollments.html">

                    <i class="fa-solid fa-user-check"></i>

                    Enrollments

                </a>

            </li>

            <li>

                <a href="admin-login.html"
                   id="adminLogoutBtn">

                    <i class="fa-solid fa-right-from-bracket"></i>

                    Logout

                </a>

            </li>

        </ul>

    </aside>

    <!-- =========================
            MAIN CONTENT
    ========================== -->

    <main class="main-content">

        <!-- Top Bar -->

        <header class="topbar">

            <h1 id="pageTitle">

                Add New Course

            </h1>

            <br>

            <p id="pageSubtitle">

                Fill in the details below to create a new course.

            </p>

        </header>

        <!-- =========================
             ADD COURSE FORM
        ========================== -->

        <section class="course-card">

            <form id="addCourseForm"
                  action="#"
                  method="post"
                  novalidate>

                <!-- Course Code -->

                <label for="courseCode">

                    Course Code

                </label>

                <input
                    type="text"
                    id="courseCode"
                    name="courseCode"
                    placeholder="Example: AI116"
                    maxlength="10"
                    autocomplete="off"
                    required>

                <!-- Course Name -->

                <label for="courseName">

                    Course Name

                </label>

                <input
                    type="text"
                    id="courseName"
                    name="courseName"
                    placeholder="Enter Course Name"
                    maxlength="100"
                    autocomplete="off"
                    required>

                <!-- Category -->

                <label for="category">

                    Category

                </label>

                <select
                    id="category"
                    name="category"
                    required>

                    <option value="">

                        Select Category

                    </option>

                    <option value="Programming">

                        Programming

                    </option>

                    <option value="Artificial Intelligence">

                        Artificial Intelligence

                    </option>

                    <option value="Database">

                        Database

                    </option>

                    <option value="Computer Science">

                        Computer Science

                    </option>

                    <option value="Cloud Computing">

                        Cloud Computing

                    </option>

                    <option value="Cyber Security">

                        Cyber Security

                    </option>

                    <option value="Data Science">

                        Data Science

                    </option>

                    <option value="Design">

                        Design

                    </option>

                </select>

                <!-- Duration -->

                <label for="duration">

                    Duration

                </label>

                <input
                    type="text"
                    id="duration"
                    name="duration"
                    placeholder="Example: 8 Weeks"
                    autocomplete="off"
                    required>

                <!-- Level -->

                <label for="level">

                    Level

                </label>

                <select
                    id="level"
                    name="level"
                    required>

                    <option value="">

                        Select Level

                    </option>

                    <option value="Beginner">

                        Beginner

                    </option>

                    <option value="Intermediate">

                        Intermediate

                    </option>

                    <option value="Advanced">

                        Advanced

                    </option>

                </select>
                                <!-- Course Description -->

                <label for="courseDescription">

                    Course Description

                </label>

                <textarea
                    id="courseDescription"
                    name="courseDescription"
                    rows="6"
                    placeholder="Enter Course Description"
                    maxlength="1000"
                    required></textarea>

                <!-- Course Message -->

                <p id="courseMessage"
                class="form-message"
                role="alert"
                aria-live="polite"></p>

                <!-- Form Buttons -->

                <div class="form-buttons">

                    <button
                        type="submit"
                        class="student-btn"
                        id="saveCourseBtn">

                        <i class="fa-solid fa-floppy-disk"></i>

                        Save Course

                    </button>

                    <button
                        type="reset"
                        class="delete-btn"
                        id="clearCourseBtn">

                        <i class="fa-solid fa-eraser"></i>

                        Clear Form

                    </button>

                </div>

            </form>

        </section>

    </main>

</div>

<!-- =========================
        JavaScript Files
========================= -->

<script type="module" src="js/admin.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Student Registration Portal">

    <title>Student Registration</title>

    <!-- Google Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<main>

<div class="form-container">

<div class="form-card register-card">

<div class="form-icon register-icon">

<i class="fa-solid fa-user-plus"></i>

</div>

<h1>

Student Registration

</h1>

<p>

Create your account to access courses,
monitor progress, and begin your
learning journey.

</p>

<form id="registerForm">

<div class="input-group">

<label for="fullName">

Full Name

</label>

<input
type="text"
id="fullName"
name="fullName"
placeholder="Enter your full name"
autocomplete="name"
required>

<small
id="fullNameError"
class="error-message">

</small>

</div>

<div class="input-group">

<label for="registerNumber">

Register Number

</label>

<input
type="text"
id="registerNumber"
name="registerNumber"
placeholder="Enter your register number"
required>

<small
id="registerNumberError"
class="error-message">

</small>

</div>

<div class="input-group">

<label for="registerEmail">

Email Address

</label>

<input
type="email"
id="registerEmail"
name="registerEmail"
placeholder="Enter your email"
autocomplete="email"
required>

<small
id="registerEmailError"
class="error-message">

</small>

</div>

<div class="input-group">

<label for="phone">

Phone Number

</label>

<input
type="tel"
id="phone"
name="phone"
placeholder="Enter your phone number"
maxlength="10"
required>

<small
id="phoneError"
class="error-message">

</small>

</div>
                <div class="input-group">

                    <label for="department">

                        Department

                    </label>

                    <select
                        id="department"
                        name="department"
                        required>

                        <option value="">Select Department</option>
                        <option value="BSc Computer Science with AI">BSc Computer Science with AI</option>

                    </select>

                    <small
                        id="departmentError"
                        class="error-message">

                    </small>

                </div>

                <div class="input-group">

                    <label for="year">

                        Year

                    </label>

                    <select
                        id="year"
                        name="year"
                        required>

                        <option value="">Select Year</option>
                        <option value="1">I Year</option>
                        <option value="2">II Year</option>
                        <option value="3">III Year</option>

                    </select>

                    <small
                        id="yearError"
                        class="error-message">

                    </small>

                </div>

                <div class="input-group">

                    <label for="registerPassword">

                        Password

                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="registerPassword"
                            name="registerPassword"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required>

                       <i
class="toggle-password"
data-target="registerPassword">
</i>

                    </div>

                    <small
                        id="registerPasswordError"
                        class="error-message">

                    </small>

                </div>

                <div class="input-group">

                    <label for="confirmPassword">

                        Confirm Password

                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            required>

  <i
class="toggle-password"
data-target="confirmPassword">
</i>

                    </div>

                    <small
                        id="confirmPasswordError"
                        class="error-message">

                    </small>

                </div>

                <button
                    type="submit"
                    id="registerBtn"
                    class="form-btn register-main">

                    <i class="fa-solid fa-user-plus"></i>

                    Register

                </button>

                <p
id="registerMessage"
class="error-message">
</p>

            </form>

            <div class="bottom-text">

                Already have an account?

                <a href="student-login.html">

                    Login Here

                </a>

            </div>

            <div class="back-home">

                <a href="index.html"
                   class="back-btn">

                    <i class="fa-solid fa-house"></i>

                    Back to Home

                </a>

            </div>

        </div>

    </div>

</main>

<!-- Authentication JavaScript -->

<script type="module" src="js/auth.js"></script>
</body>

</html>

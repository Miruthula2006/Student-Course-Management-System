<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Edit and update course information in the Student Course Management System Administrator Panel.">

    <title>Edit Course</title>

    <!-- CSS -->

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/dashboard.css">

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- =========================
             SIDEBAR
    ========================== -->

    <aside class="sidebar">

        <h2>

            <i class="fa-solid fa-user-shield"></i>

            SCMS

        </h2>

        <p>

            Administrator Panel

        </p>

        <ul>

            <li>

                <a href="admin-dashboard.html">

                    <i class="fa-solid fa-house"></i>

                    Dashboard

                </a>

            </li>

            <li class="active">

                <a href="manage-courses.html">

                    <i class="fa-solid fa-book"></i>

                    Manage Courses

                </a>

            </li>

            <li>

                <a href="add-course.html">

                    <i class="fa-solid fa-circle-plus"></i>

                    Add Course

                </a>

            </li>

            <li>

                <a href="manage-students.html">

                    <i class="fa-solid fa-users"></i>

                    Manage Students

                </a>

            </li>

            <li>

                <a href="view-enrollments.html">

                    <i class="fa-solid fa-user-check"></i>

                    Enrollments

                </a>

            </li>

            <li>

                <a href="admin-login.html"
                   id="adminLogoutBtn">

                    <i class="fa-solid fa-right-from-bracket"></i>

                    Logout

                </a>

            </li>

        </ul>

    </aside>

    <!-- =========================
            MAIN CONTENT
    ========================== -->

    <main class="main-content">

        <!-- Top Bar -->

        <header class="topbar">

            <h1 id="pageTitle">

                Edit Course

            </h1>

            <br>

            <p id="pageSubtitle">

                Update the selected course information.

            </p>

        </header>

        <!-- =========================
             EDIT COURSE FORM
        ========================== -->

        <section class="course-card">

            <form id="editCourseForm"
      novalidate>

                <!-- Hidden Course ID -->

                <input
                    type="hidden"
                    id="courseId"
                    name="courseId"
                    value="AI101">

                <!-- Course Code -->

                <label for="courseCode">

                    Course Code

                </label>

                <input
                    type="text"
                    id="courseCode"
                    name="courseCode"
                    value="AI101"
                    maxlength="10"
                    autocomplete="off"
                    required>

                <!-- Course Name -->

                <label for="courseName">

                    Course Name

                </label>

                <input
                    type="text"
                    id="courseName"
                    name="courseName"
                    value="Artificial Intelligence"
                    maxlength="100"
                    autocomplete="off"
                    required>

                <!-- Category -->

                <label for="category">

                    Category

                </label>

                <select
                    id="category"
                    name="category"
                    required>

                    <option value="Artificial Intelligence" selected>

                        Artificial Intelligence

                    </option>

                    <option value="Programming">

                        Programming

                    </option>

                    <option value="Database">

                        Database

                    </option>

                    <option value="Computer Science">

                        Computer Science

                    </option>

                    <option value="Cloud Computing">

                        Cloud Computing

                    </option>

                    <option value="Cyber Security">

                        Cyber Security

                    </option>

                    <option value="Data Science">

                        Data Science

                    </option>

                    <option value="Design">

                        Design

                    </option>

                </select>

                <!-- Duration -->

                <label for="duration">

                    Duration

                </label>

                <input
                    type="text"
                    id="duration"
                    name="duration"
                    value="12 Weeks"
                    autocomplete="off"
                    required>

                <!-- Level -->

                <label for="level">

                    Level

                </label>

                <select
                    id="level"
                    name="level"
                    required>

                    <option value="Beginner" selected>

                        Beginner

                    </option>

                    <option value="Intermediate">

                        Intermediate

                    </option>

                    <option value="Advanced">

                        Advanced

                    </option>

                </select>
                                <!-- Course Description -->

                <label for="courseDescription">

                    Course Description

                </label>

                <textarea
                    id="courseDescription"
                    name="courseDescription"
                    rows="6"
                    maxlength="1000"
                    required>Learn AI fundamentals, intelligent agents, machine learning basics, and problem-solving techniques.</textarea>

                <!-- Form Buttons -->

                <div class="form-buttons">

                    <button
                        type="submit"
                        class="student-btn"
                        id="updateCourseBtn">

                        <i class="fa-solid fa-pen"></i>

                        Update Course

                    </button>

                    <a href="manage-courses.html"
                       aria-label="Return to Manage Courses">

                        <button
                            type="button"
                            class="delete-btn"
                            id="cancelBtn">

                            <i class="fa-solid fa-arrow-left"></i>

                            Cancel

                        </button>

                    </a>

                </div>

            </form>

        </section>

    </main>

</div>

<!-- JavaScript -->

<script type="module" src="js/admin.js"></script>

</body>
</html>

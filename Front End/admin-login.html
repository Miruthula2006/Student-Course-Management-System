<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Administrator Login Portal">

    <title>Administrator Portal</title>

    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<main>

<div class="form-container">

<div class="form-card">

<div class="form-icon admin-icon">

<i class="fa-solid fa-user-shield"></i>

</div>

<h1 class="admin-title">

Administrator Portal

</h1>

<p>

Login to manage students,
courses, enrollments,
and academic records securely.

</p>

<form id="adminLoginForm">

<div class="input-group">

<label for="adminEmail">

Admin Email

</label>

<input
type="email"
id="adminEmail"
name="adminEmail"
placeholder="Enter your admin email"
autocomplete="email"
required>

</div>

<div class="input-group">

<label for="adminPassword">

Password

</label>

<div class="password-box">

<input
type="password"
id="adminPassword"
name="adminPassword"
placeholder="Enter your password"
autocomplete="current-password"
required>

<i
class="toggle-password"
data-target="adminPassword">
</i>

</div>

</div>
                <button
                    type="submit"
                    id="adminLoginBtn"
                    class="form-btn admin-btn-main">

                    <i class="fa-solid fa-right-to-bracket"></i>

                    Login

                </button>

                <p
id="adminLoginMessage"
class="error-message">

</p>

            </form>

            <div class="form-links">

                <a href="forgot-password.html">

                    Forgot Password?

                </a>

            </div>

            <div class="back-home">

                <a href="index.html"
                   class="back-btn">

                    <i class="fa-solid fa-house"></i>

                    Back to Home

                </a>

            </div>

        </div>

    </div>

</main>
<!-- Authentication JavaScript -->

<script type="module" src="js/auth.js"></script></body>

</html>
